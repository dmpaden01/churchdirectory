# If this sits behind another reverse proxy (e.g. Nginx Proxy Manager), that
# proxy already set X-Forwarded-Proto/X-Real-IP correctly for the original
# client connection - pass those through as-is instead of overwriting them
# with values from this hop (which would report this container's own
# plain-HTTP connection and the proxy's IP instead of the real ones). Falls
# back to this hop's own values for direct access (e.g. via HTTP_PORT).
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_real_ip $client_real_ip {
    default $http_x_real_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API and photo-serving routes are all under /api - proxy straight to the
    # backend container. Browsers only ever see this one origin, so auth
    # cookies are same-origin regardless of the public domain used.
    location /api/ {
        proxy_pass http://churchdirectory-backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Single-page app: let React Router-less client-side view state work by
    # falling back to index.html for anything that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is never cached so
    # deploys are picked up immediately.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
