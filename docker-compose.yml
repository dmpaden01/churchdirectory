services:
  churchdirectory-db:
    image: mongo:7
    container_name: churchdirectory-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - churchdirectory-db-data:/data/db
    networks:
      - churchdirectory-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  churchdirectory-backend:
    build:
      context: ./backend
    container_name: churchdirectory-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_CLIENT_NAME: ${SMTP_CLIENT_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
    depends_on:
      churchdirectory-db:
        condition: service_healthy
    networks:
      - churchdirectory-net

  churchdirectory-frontend:
    build:
      context: ./frontend
    container_name: churchdirectory-frontend
    restart: unless-stopped
    # Only needed for direct/local access. If you're routing all traffic
    # through a reverse proxy (e.g. Nginx Proxy Manager) on the npm-network
    # below, you can remove this - NPM reaches the container by name instead.
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - churchdirectory-backend
    networks:
      - churchdirectory-net
      - npm-network

networks:
  churchdirectory-net:
    name: churchdirectory-net
  # Shared network with your reverse proxy (e.g. Nginx Proxy Manager), so it
  # can reach this container by name (churchdirectory-frontend:80) instead of
  # going back out through the host's published port. Must already exist -
  # either it's the network NPM's own compose file created, or create it
  # yourself first with: docker network create <name>
  npm-network:
    external: true
    name: ${NPM_NETWORK_NAME:-npm-network}

volumes:
  churchdirectory-db-data:
    name: churchdirectory-db-data
