# Parallel test environment - mirrors docker-compose.yml with "-test" suffixed
# container/volume/network names and the host port incremented by 1, so it can
# run alongside the production stack without colliding.
#
# Usage:
#   docker compose -f docker-compose.test.yml --env-file .env.test -p churchdirectory-test up -d --build
services:
  churchdirectory-db:
    image: mongo:4.4
    container_name: churchdirectory-db-test
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - churchdirectory-db-data-test:/data/db
    networks:
      - churchdirectory-net-test
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  churchdirectory-backend:
    build:
      context: ./backend
    container_name: churchdirectory-backend-test
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_CLIENT_NAME: ${SMTP_CLIENT_NAME}
      EMAIL_FROM: ${EMAIL_FROM}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      # Family/individual photos live on this volume instead of in Mongo -
      # see backend/utils/photoStorage.js.
      PHOTOS_DIR: /app/data/photos
    volumes:
      - churchdirectory-photos-test:/app/data/photos
    depends_on:
      churchdirectory-db:
        condition: service_healthy
    networks:
      - churchdirectory-net-test

  churchdirectory-frontend:
    build:
      context: ./frontend
    container_name: churchdirectory-frontend-test
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8889}:80"
    depends_on:
      - churchdirectory-backend
    networks:
      - churchdirectory-net-test
      - npm-network

networks:
  churchdirectory-net-test:
    name: churchdirectory-net-test
  npm-network:
    external: true
    name: ${NPM_NETWORK_NAME:-npm-network}

volumes:
  churchdirectory-db-data-test:
    name: churchdirectory-db-data-test
  churchdirectory-photos-test:
    name: churchdirectory-photos-test
